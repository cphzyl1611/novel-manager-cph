<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NovelHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleDrawer()">☰</button>
  <div class="app-title">📚 <span>NovelHub</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索书名、作者..." oninput="onSearch()">
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<nav class="drawer" id="drawer">
  <h3>菜单</h3>
  <a href="#" class="active" onclick="showPage('home');toggleDrawer()">🏠 首页</a>
  <a href="#" onclick="showPage('updates');toggleDrawer()">🔄 小说更新</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">📋 重复处理</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">📁 分组</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">⚙️ 设置</a>
  <div style="margin-top:auto;font-size:11px;color:var(--muted)"><div id="drawerStatus">未连接</div></div>
</nav>
<div class="group-tabs" id="groupTabs"></div>
<div class="shelf" id="shelf"><div class="loading"><div class="spinner"></div></div></div>
<div class="empty-state" id="emptyState" style="display:none">📭 暂无小说</div>
<div class="reader" id="reader">
  <div class="reader-top">
    <button class="back-btn" onclick="closeReader()">←</button>
    <div class="reader-title" id="readerTitle"></div>
  </div>
  <div class="reader-content" id="readerContent">加载中...</div>
</div>
<div class="updates-page" id="updatesPage">
  <h2 style="margin-bottom:12px">🔄 更新候选</h2>
  <div id="updatesContent"><div class="loading"><div class="spinner"></div></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="groupModal">
  <div class="modal-box">
    <h3>创建分组</h3>
    <input type="text" id="groupNameInput" placeholder="分组名称" maxlength="100">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeGroupModal()">取消</button>
      <button class="btn-primary" onclick="createGroup()">创建</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
