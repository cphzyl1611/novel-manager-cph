<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NovelHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleDrawer()">☰</button>
  <div class="app-title">📚 <span>NovelHub</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索书名、作者..." oninput="onSearch()">
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<nav class="drawer" id="drawer">
  <h3>菜单</h3>
  <a href="#" class="active" onclick="showPage('home');toggleDrawer()">🏠 首页</a>
  <a href="#" onclick="showPage('updates');toggleDrawer()">🔄 小说更新</a>
  <a href="#" class="active" onclick="showPage('upload');toggleDrawer()">📤 上传新书</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">📋 重复处理</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">📁 分组</a>
  <a href="#" onclick="showPage('home');toggleDrawer()">⚙️ 设置</a>
  <div style="margin-top:auto;font-size:11px;color:var(--muted)"><div id="drawerStatus">未连接</div></div>
</nav>
<div class="group-tabs" id="groupTabs"></div>
<div class="shelf" id="shelf"><div class="loading"><div class="spinner"></div></div></div>
<div class="empty-state" id="emptyState" style="display:none">📭 暂无小说</div>
<div class="reader" id="reader">
  <div class="reader-top" id="readerTop">
    <button class="back-btn" onclick="closeReader()">←</button>
    <div class="reader-title" id="readerTitle"></div>
    <div class="reader-encoding" id="readerEncoding" style="display:none"></div>
    <span class="reader-progress" id="readerProgressText"></span>
    <button class="toc-btn" id="tocBtn" onclick="toggleToc()" title="目录">☰</button>
    <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">⚙</button>
  </div>
  <div class="reader-warning" id="readerWarning" style="display:none"></div>
  <div class="reader-toast" id="readerToast"></div>
  <div class="reader-content" id="readerContent" onclick="onReaderTap()">加载中...</div>

  <!-- TOC panel -->
  <div class="toc-overlay" id="tocOverlay" onclick="toggleToc()"></div>
  <div class="toc-panel" id="tocPanel">
    <div class="toc-header">
      <span class="toc-title">目录</span>
      <span class="toc-count" id="tocCount"></span>
      <button class="toc-close" onclick="toggleToc()">✕</button>
    </div>
    <div class="toc-list" id="tocList"></div>
  </div>

  <!-- settings panel INSIDE reader -->
  <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
  <div class="settings-sheet" id="settingsPanel">
    <div class="sheet-handle"></div>
    <div class="sheet-row">
      <span class="label">字体大小</span>
      <div class="controls">
        <button class="btn-sm" id="fontSizeDown" onclick="changeFontSize(-1)">A−</button>
        <span class="val" id="fontSizeVal">18px</span>
        <button class="btn-sm" id="fontSizeUp" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div class="sheet-row">
      <span class="label">行距</span>
      <div class="controls">
        <button class="btn-sm" id="lhDown" onclick="changeLineHeight(-1)">−</button>
        <span class="val" id="lineHeightVal">标准</span>
        <button class="btn-sm" id="lhUp" onclick="changeLineHeight(1)">+</button>
      </div>
    </div>
    <div class="sheet-row">
      <span class="label">主题</span>
      <div class="theme-dots">
        <div class="theme-dot light active" id="themeLight" onclick="setTheme('light')" title="浅色">☀</div>
        <div class="theme-dot sepia" id="themeSepia" onclick="setTheme('sepia')" title="护眼">☕</div>
        <div class="theme-dot dark" id="themeDark" onclick="setTheme('dark')" title="夜间">🌙</div>
      </div>
    </div>
    <div class="sheet-row">
      <span class="label">导航</span>
      <div class="controls">
        <button class="btn-sm" id="btnTop" onclick="scrollToTop()" title="返回顶部">⬆</button>
        <button class="btn-sm" id="btnBack" onclick="closeReader()" title="返回书架">🏠</button>
      </div>
    </div>
  </div>
</div>
<div class="updates-page" id="updatesPage">
  <h2 style="margin-bottom:4px;padding:0 16px">🔄 小说更新</h2>
  <p class="updates-disclaimer">本页面只检测和生成建议，不会自动替换、删除或移动任何小说文件。</p>
  <div class="updates-actions">
    <button class="btn-primary" onclick="doScanIncoming()" id="btnScanIncoming">🔍 扫描新下载区</button>
    <button class="btn-primary" onclick="doAnalyzeIncoming()" id="btnAnalyzeIncoming" style="background:var(--accent)">📊 检测新下载小说</button>
  </div>
  <div class="updates-summary" id="updatesSummary" style="display:none"></div>
  <div id="updatesContent"><div class="loading"><div class="spinner"></div></div></div>
</div>
<div class="upload-page" id="uploadPage">
  <h2 style="margin-bottom:4px;padding:0 16px">📤 上传新下载的小说</h2>
  <p style="color:var(--muted);font-size:13px;padding:0 16px;margin-bottom:16px">文件会保存到"新下载区"，不会覆盖或替换已有小说。</p>
  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">📂</div>
    <div class="upload-text">点击选择 TXT 文件</div>
    <div class="upload-hint">支持多选，单文件最大 50MB</div>
    <input type="file" id="uploadInput" accept=".txt" multiple style="display:none" onchange="onFilesSelected()">
  </div>
  <div class="upload-list" id="uploadList"></div>
  <div class="upload-actions" id="uploadActions" style="display:none">
    <button class="btn-primary" id="uploadBtn" onclick="doUpload()" style="padding:12px 28px;font-size:15px">上传到新下载区</button>
  </div>
  <div class="upload-result" id="uploadResult"></div>
  <div class="upload-next" id="uploadNext" style="display:none">
    <button class="btn-primary" onclick="scanIncoming()" style="padding:12px 24px;font-size:15px">🔍 立即扫描新下载区</button>
    <button class="btn-cancel" onclick="showPage('updates')" style="padding:12px 24px;font-size:15px;background:var(--card);border:1px solid var(--border);border-radius:8px">📋 去更新检测</button>
  </div>
  <div class="scan-result" id="scanResult"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="groupModal">
  <div class="modal-box">
    <h3>创建分组</h3>
    <input type="text" id="groupNameInput" placeholder="分组名称" maxlength="100">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeGroupModal()">取消</button>
      <button class="btn-primary" onclick="createGroup()">创建</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
